name: Setup Vercel env vars

# Запускается вручную из вкладки Actions.
# Принимает Vercel token и блок .env как input.
# Маскирует секреты в логах, удаляет старые env vars,
# создаёт новые на Production+Preview+Development и триггерит prod redeploy.

on:
  workflow_dispatch:
    inputs:
      vercel_token:
        description: "Vercel API token (https://vercel.com/account/tokens)"
        required: true
        type: string
      env_block:
        description: "Многострочный .env блок (KEY=VALUE на каждой строке)"
        required: true
        type: string
      project_id:
        description: "Vercel Project ID"
        required: true
        type: string
        default: "prj_6HGEnF3iYrb5ktKWnHFq10AXSkrJ"
      team_id:
        description: "Vercel Team ID"
        required: true
        type: string
        default: "team_Fk6A2aSsOaXCyyNwhoZKXWCe"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ inputs.vercel_token }}
      PROJECT_ID:   ${{ inputs.project_id }}
      TEAM_ID:      ${{ inputs.team_id }}
      ENV_BLOCK:    ${{ inputs.env_block }}
    steps:
      - name: Mask token and values
        shell: bash
        run: |
          echo "::add-mask::$VERCEL_TOKEN"
          while IFS= read -r line; do
            line="${line%$'\r'}"
            case "$line" in ""|"#"*) continue;; esac
            value="${line#*=}"
            value="${value%\"}"; value="${value#\"}"
            value="${value%\'}"; value="${value#\'}"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done <<< "$ENV_BLOCK"

      - name: Apply env vars to Vercel
        shell: bash
        run: |
          set -e
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          echo "fetching existing env vars..."
          curl -fsS -H "$AUTH" \
            "$API/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID" > existing.json

          while IFS= read -r raw; do
            line="${raw%$'\r'}"
            case "$line" in ""|"#"*) continue;; esac
            key="${line%%=*}"
            value="${line#*=}"
            value="${value%\"}"; value="${value#\"}"
            value="${value%\'}"; value="${value#\'}"
            if [ -z "$key" ] || [ -z "$value" ]; then continue; fi

            echo "::group::$key"

            # Delete any existing entries with this key
            ids=$(jq -r --arg k "$key" '.envs[] | select(.key == $k) | .id' existing.json)
            for id in $ids; do
              echo "  removing old $key ($id)"
              curl -fsS -X DELETE -H "$AUTH" \
                "$API/v9/projects/$PROJECT_ID/env/$id?teamId=$TEAM_ID" >/dev/null
            done

            # Type: NEXT_PUBLIC_* — plain (visible in client bundle), rest — encrypted
            type="encrypted"
            case "$key" in NEXT_PUBLIC_*) type="plain";; esac

            payload=$(jq -nc --arg k "$key" --arg v "$value" --arg t "$type" \
              '{key:$k, value:$v, type:$t, target:["production","preview","development"]}')
            echo "  creating $key (type=$type)"
            curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "$payload" \
              "$API/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID" >/dev/null

            echo "::endgroup::"
          done <<< "$ENV_BLOCK"

          echo "all env vars applied"

      - name: Trigger production redeploy
        shell: bash
        run: |
          set -e
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          last=$(curl -fsS -H "$AUTH" \
            "$API/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&target=production&limit=1" \
            | jq -r '.deployments[0].uid')
          echo "rebuilding $last"

          payload=$(jq -nc --arg id "$last" \
            '{name:"family-os", deploymentId:$id, target:"production"}')
          url=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "$payload" \
            "$API/v13/deployments?teamId=$TEAM_ID&forceNew=1" \
            | jq -r '.url')
          echo "new deployment: https://$url"
          echo "follow at https://vercel.com/$TEAM_ID/family-os"
