name: Setup Vercel env vars

# Запускается вручную из вкладки Actions.
# Принимает Vercel token и блок .env как input.
# Маскирует все секреты в логах, удаляет старые env vars,
# создаёт новые на Production+Preview+Development и триггерит prod redeploy.

on:
  workflow_dispatch:
    inputs:
      vercel_token:
        description: "Vercel API token (https://vercel.com/account/tokens)"
        required: true
        type: string
      env_block:
        description: "Многострочный .env блок (KEY=VALUE на каждой строке)"
        required: true
        type: string
      project_id:
        description: "Vercel Project ID"
        required: true
        type: string
        default: "prj_6HGEnF3iYrb5ktKWnHFq10AXSkrJ"
      team_id:
        description: "Vercel Team ID"
        required: true
        type: string
        default: "team_Fk6A2aSsOaXCyyNwhoZKXWCe"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ inputs.vercel_token }}"
          # Маскируем каждое VALUE из env-блока, чтоб не утекло в логи
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [[ -z "$line" || "$line" == \#* ]] && continue
            value="${line#*=}"
            value="${value%\"}"; value="${value#\"}"
            value="${value%\'}"; value="${value#\'}"
            [[ -n "$value" ]] && echo "::add-mask::$value"
          done <<< "${{ inputs.env_block }}"

      - name: Apply env vars to Vercel
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token }}
          PROJECT_ID:   ${{ inputs.project_id }}
          TEAM_ID:      ${{ inputs.team_id }}
          ENV_BLOCK:    ${{ inputs.env_block }}
        run: |
          set -e
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer ${VERCEL_TOKEN}"

          echo "→ загружаю текущие env vars"
          existing=$(curl -fsS -H "$AUTH" "$API/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID")

          while IFS= read -r raw; do
            line="${raw%$'\r'}"
            [[ -z "$line" || "$line" == \#* ]] && continue
            key="${line%%=*}"
            value="${line#*=}"
            value="${value%\"}"; value="${value#\"}"
            value="${value%\'}"; value="${value#\'}"
            [[ -z "$key" || -z "$value" ]] && continue

            # Удаляем все существующие записи с этим key
            ids=$(echo "$existing" | python3 -c "
import json, sys
data = json.load(sys.stdin)
target = '$key'
for e in data.get('envs', []):
    if e.get('key') == target:
        print(e['id'])
")
            for id in $ids; do
              echo "  - удаляю $key ($id)"
              curl -fsS -X DELETE -H "$AUTH" \
                "$API/v9/projects/$PROJECT_ID/env/$id?teamId=$TEAM_ID" >/dev/null
            done

            # Тип: NEXT_PUBLIC_* и NEXT_PUBLIC_APP_URL могут быть plain;
            # секреты — encrypted (по умолчанию это всё encrypted).
            type="encrypted"
            if [[ "$key" == NEXT_PUBLIC_* ]]; then type="plain"; fi

            echo "  + добавляю $key (type=$type) для всех окружений"
            payload=$(python3 -c "
import json, sys, os
print(json.dumps({
  'key': os.environ['K'],
  'value': os.environ['V'],
  'type': os.environ['T'],
  'target': ['production','preview','development']
}))" K="$key" V="$value" T="$type")
            curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "$payload" \
              "$API/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID" >/dev/null
          done <<< "$ENV_BLOCK"

          echo "✓ все переменные выставлены"

      - name: Trigger production redeploy
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token }}
          PROJECT_ID:   ${{ inputs.project_id }}
          TEAM_ID:      ${{ inputs.team_id }}
        run: |
          set -e
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer ${VERCEL_TOKEN}"

          # Берём последний production deployment и переразворачиваем его
          # (rebuild без хука — заберёт свежие env vars).
          last=$(curl -fsS -H "$AUTH" \
            "$API/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&target=production&limit=1" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['deployments'][0]['uid'])")
          echo "→ rebuild deployment $last"

          payload=$(python3 -c "
import json, sys, os
print(json.dumps({
  'name': 'family-os',
  'deploymentId': os.environ['ID'],
  'target': 'production'
}))" ID="$last")
          curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "$payload" \
            "$API/v13/deployments?teamId=$TEAM_ID&forceNew=1" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('  →', d.get('url','(no url)'))"

          echo "✓ redeploy запущен — следи на https://vercel.com/$TEAM_ID/family-os"
