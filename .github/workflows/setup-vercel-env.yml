name: Setup Vercel env vars

# Запускается вручную из вкладки Actions.
# 6 отдельных полей вместо одного многострочного — GitHub workflow_dispatch
# c type:string обрезает многострочный ввод.

on:
  workflow_dispatch:
    inputs:
      vercel_token:
        description: "Vercel API token (vcp_…)"
        required: true
        type: string
      next_public_supabase_url:
        description: "NEXT_PUBLIC_SUPABASE_URL"
        required: true
        type: string
        default: "https://kuinruimnpnxhbpdjohj.supabase.co"
      next_public_supabase_anon_key:
        description: "NEXT_PUBLIC_SUPABASE_ANON_KEY"
        required: true
        type: string
      supabase_service_role_key:
        description: "SUPABASE_SERVICE_ROLE_KEY"
        required: true
        type: string
      anthropic_api_key:
        description: "ANTHROPIC_API_KEY (sk-ant-…)"
        required: true
        type: string
      next_public_app_url:
        description: "NEXT_PUBLIC_APP_URL"
        required: true
        type: string
        default: "https://family-os-silk.vercel.app"
      cron_secret:
        description: "CRON_SECRET"
        required: true
        type: string
        default: "family-os-cron-2026"
      project_id:
        description: "Vercel Project ID"
        required: true
        type: string
        default: "prj_6HGEnF3iYrb5ktKWnHFq10AXSkrJ"
      team_id:
        description: "Vercel Team ID"
        required: true
        type: string
        default: "team_Fk6A2aSsOaXCyyNwhoZKXWCe"
      branch:
        description: "Branch для prod deploy"
        required: true
        type: string
        default: "claude/setup-env-supabase-JpuiP"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ inputs.vercel_token }}
      PROJECT_ID:   ${{ inputs.project_id }}
      TEAM_ID:      ${{ inputs.team_id }}
      BRANCH:       ${{ inputs.branch }}
      V_URL:        ${{ inputs.next_public_supabase_url }}
      V_ANON:       ${{ inputs.next_public_supabase_anon_key }}
      V_SROLE:      ${{ inputs.supabase_service_role_key }}
      V_ANTHROPIC:  ${{ inputs.anthropic_api_key }}
      V_APP_URL:    ${{ inputs.next_public_app_url }}
      V_CRON:       ${{ inputs.cron_secret }}
    steps:
      - name: Mask all secret values
        shell: bash
        run: |
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$V_ANON"
          echo "::add-mask::$V_SROLE"
          echo "::add-mask::$V_ANTHROPIC"
          echo "::add-mask::$V_CRON"

      - name: Apply env vars to Vercel
        shell: bash
        run: |
          set -e
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          echo "→ загружаем существующие env vars"
          curl -fsS -H "$AUTH" \
            "$API/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID" > existing.json
          echo "  найдено $(jq '.envs | length' existing.json) шт"

          apply_var() {
            local key="$1"
            local value="$2"
            local type="encrypted"
            case "$key" in NEXT_PUBLIC_*) type="plain";; esac

            if [ -z "$value" ]; then
              echo "  ✗ $key — пустое значение, пропускаем"
              return
            fi

            echo "::group::$key"
            ids=$(jq -r --arg k "$key" '.envs[] | select(.key == $k) | .id' existing.json)
            for id in $ids; do
              echo "  - удаляем существующий $id"
              curl -fsS -X DELETE -H "$AUTH" \
                "$API/v9/projects/$PROJECT_ID/env/$id?teamId=$TEAM_ID" >/dev/null
            done

            payload=$(jq -nc --arg k "$key" --arg v "$value" --arg t "$type" \
              '{key:$k, value:$v, type:$t, target:["production","preview","development"]}')
            resp=$(curl -sS -w "\n%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "$payload" \
              "$API/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID")
            body=$(echo "$resp" | head -n -1)
            code=$(echo "$resp" | tail -n 1)
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "  ✓ создано (type=$type)"
            else
              echo "  ✗ HTTP $code: $body"
            fi
            echo "::endgroup::"
          }

          apply_var "NEXT_PUBLIC_SUPABASE_URL"      "$V_URL"
          apply_var "NEXT_PUBLIC_SUPABASE_ANON_KEY" "$V_ANON"
          apply_var "SUPABASE_SERVICE_ROLE_KEY"     "$V_SROLE"
          apply_var "ANTHROPIC_API_KEY"             "$V_ANTHROPIC"
          apply_var "NEXT_PUBLIC_APP_URL"           "$V_APP_URL"
          apply_var "CRON_SECRET"                   "$V_CRON"

          echo ""
          echo "=== verification ==="
          curl -fsS -H "$AUTH" \
            "$API/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID" > final.json
          for need in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY ANTHROPIC_API_KEY NEXT_PUBLIC_APP_URL CRON_SECRET; do
            count=$(jq -r --arg k "$need" '[.envs[] | select(.key == $k)] | length' final.json)
            if [ "$count" -gt 0 ]; then
              echo "  ✓ $need ($count entries)"
            else
              echo "  ✗ $need ОТСУТСТВУЕТ"
            fi
          done

      - name: Promote latest branch HEAD to production
        shell: bash
        run: |
          set -e
          API="https://api.vercel.com"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          payload=$(jq -nc --arg branch "$BRANCH" --arg project "$PROJECT_ID" \
            '{
              name: "family-os",
              project: $project,
              target: "production",
              gitSource: {
                type: "github",
                ref: $branch,
                repoId: "1224410731"
              }
            }')

          echo "→ creating production deployment from branch=$BRANCH"
          resp=$(curl -sS -w "\n%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d "$payload" \
            "$API/v13/deployments?teamId=$TEAM_ID&forceNew=1")
          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n 1)
          if [ "$code" = "200" ] || [ "$code" = "201" ]; then
            url=$(echo "$body" | jq -r '.url')
            echo "✓ deployment: https://$url"
          else
            echo "::warning::HTTP $code: $body"
            echo "→ fallback: rebuild last production deployment"
            last=$(curl -fsS -H "$AUTH" \
              "$API/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&target=production&limit=1" \
              | jq -r '.deployments[0].uid')
            payload=$(jq -nc --arg id "$last" \
              '{name:"family-os", deploymentId:$id, target:"production"}')
            url=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "$payload" \
              "$API/v13/deployments?teamId=$TEAM_ID&forceNew=1" \
              | jq -r '.url')
            echo "✓ rebuilt: https://$url"
          fi
          echo ""
          echo "→ follow at https://vercel.com/fedors-projects-03aefc10/family-os"
